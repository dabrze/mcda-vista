[build-system]
requires = ["setuptools>=65", "setuptools-scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "mcda-vista"
version = "0.1.0"
description = "VISTA — Visual Inspection of Sensitivity To Alternatives in MCDA methods"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VISTA Contributors"}
]
keywords = ["MCDA", "sensitivity", "visualization", "decision-making"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy",
    "pyDecision",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
app = ["streamlit>=1.20"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
mcda-vista-app = "mcda_vista.app.dashboard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
