[build-system]
requires = ["setuptools>=65", "setuptools-scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "mcda-vista"
version = "0.2.0"
description = "VISTA — VISualization of relation Topologies of Alternatives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Robert Susmaga"},
    {name = "Izabela Szczech"}, 
    {name = "Dariusz Brzezinski"},
]
keywords = ["MCDA", "multicriteria ranking", "visualization", "decision-making"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.22",
    "pyDecision>=4.0",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
app = ["streamlit>=1.20"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
mcda-vista-app = "mcda_vista.app.dashboard:main"

[project.urls]
Homepage = "https://github.com/dabrze/mcda-vista"
Repository = "https://github.com/dabrze/mcda-vista"
"Bug Tracker" = "https://github.com/dabrze/mcda-vista/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcda_vista = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
# No python_version pin: mypy must target >= 3.12 to parse modern numpy stubs (PEP 695).
# 3.10 compatibility is covered by ruff target-version and the pytest matrix.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
